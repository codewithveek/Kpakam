# Runs on every pull request and on main. Each job checks one part of the repo.
# The PRD rule: a build that breaks a check or a budget does not merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  contract:
    name: Shared contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:contract

  web:
    name: Web (types, lint, tests, build, budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and component tests (with coverage thresholds)
        run: npm run test:coverage -w @kpakam/web
      - run: npm run build
      - name: Bundle budgets
        run: npm run budgets -w @kpakam/web
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: End-to-end journeys (Playwright + emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run journeys (the config starts the emulators and a production build)
        run: npm run test:e2e -w @kpakam/web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse (performance, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: npm ci
      - name: Start the emulators in the background
        run: |
          npx firebase emulators:start --only auth,firestore --project demo-kpakam-e2e --config firebase.e2e.json > emulators.log 2>&1 &
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:8180 && curl -s -o /dev/null http://127.0.0.1:9199 && exit 0; sleep 1; done
          cat emulators.log; exit 1
      - name: Build the app against the emulators
        run: npx vite build --mode e2e
        working-directory: web
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun --config=lighthouserc.json
        working-directory: web
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: web/lighthouse-reports
          if-no-files-found: ignore

  android:
    name: Android (contract tests, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Contract tests, unit tests, ktlint, detekt, debug build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest ktlintCheck detekt :app:assembleDebug
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-test-reports
          path: native/mobile/**/build/reports/tests
          if-no-files-found: ignore
