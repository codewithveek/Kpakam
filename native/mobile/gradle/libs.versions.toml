[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
androidxHilt = "1.4.0"
composeBom = "2026.11.01"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
